name = "hotstove-crawler"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# 6시간마다 자동 실행 (하루 4회)
[triggers]
crons = ["0 */6 * * *"]

[vars]
SUPABASE_URL = ""

# Secrets (wrangler secret put 으로 등록):
# SUPABASE_KEY (본인의 NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY 입력)
# GEMINI_API_KEY (본인의 GEMINI_API_KEY 입력)
